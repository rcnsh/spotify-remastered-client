version: 2
updates:
  # gradle/libs.versions.toml and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # The three Kotlin plugins share one version.
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
