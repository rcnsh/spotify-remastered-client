name: check

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A version tag must be on main and match the app's versionName, so the release's APK
      # says what it is. Checked first so a wrong tag fails in seconds.
      - name: Tag is on main and matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$on_main" != identical ] && [ "$on_main" != behind ]; then
            echo "::error::tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
          have=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "$have" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but versionName is $have"
            exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Caches Gradle's dependencies and build cache; validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Spotify's App Remote and Auth AARs, checked against pinned SHA-256s (not committed).
      - run: scripts/fetch-spotify-sdk.sh
      # No local.properties: the build uses $ANDROID_HOME and builds without Spotify app settings,
      # lyrics key or warehouse (each feature then says it isn't set up). No secrets needed.
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

  # A release APK signed with the release key, so it installs over the phone's build
  # (`adb install -r`). Pushes to main, v* tags and manual runs only: secrets never reach pull requests. The repo is
  # public, so anyone signed in to GitHub can download the artifact: it carries only the
  # public Spotify client id, never the client secret or a lyrics key (lyrics come through
  # the warehouse, ADR 0005).
  apk:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: scripts/fetch-spotify-sdk.sh
      - name: Release settings from secrets
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "spotify.clientId=$SPOTIFY_CLIENT_ID"
            echo "spotify.redirectUri=$SPOTIFY_REDIRECT_URI"
            echo "release.storeFile=$RUNNER_TEMP/release.jks"
            echo "release.keyAlias=$RELEASE_KEY_ALIAS"
          } > local.properties
      - run: ./gradlew :app:assembleRelease
        env:
          REMASTERED_RELEASE_PASSWORD: ${{ secrets.REMASTERED_RELEASE_PASSWORD }}
      # app-release.apk exists only when signed (unsigned builds are app-release-unsigned.apk).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remastered-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" local.properties

  # A v* tag publishes a GitHub release with the signed APK (bump versionName and versionCode,
  # then tag). Tags with a hyphen (v0.2.0-rc1) are marked pre-release. A rerun replaces the APK.
  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remastered-${{ github.sha }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="spotify-remastered-$TAG.apk"
          mv app-release.apk "$apk"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" -R "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" "$apk" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --generate-notes --notes "SHA-256 of the APK: \`$(sha256sum "$apk" | cut -d' ' -f1)\`" "${pre[@]}"
